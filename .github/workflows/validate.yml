name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Validate JSON files
        run: |
          for f in $(find . -name "*.json" -not -path "./node_modules/*"); do
            echo "Validating $f"
            node -e "JSON.parse(require('fs').readFileSync('$f'))"
          done
          
      - name: Check for absolute paths
        run: |
          if grep -r "C:\\\\Users\\\\" . --include="*.json" --include="*.jsonc" --exclude-dir=node_modules; then
            echo "ERROR: Absolute paths found"
            exit 1
          fi
          
      - name: Check for credentials
        run: |
          if grep -rE "(token|key|secret|password|auth)[\":=]\\s*[\"'][A-Za-z0-9+/]{20,}" . --include="*.json" --include="*.jsonc" --exclude-dir=node_modules; then
            echo "ERROR: Potential credentials found"
            exit 1
          fi
          
      - name: Validate routing matrix schema
        run: |
          node -e "
            const Ajv = require('ajv');
            const schema = require('./global/opencode.profiles/model-matrix.schema.json');
            const matrix = require('./global/opencode.profiles/model-matrix.json');
            const ajv = new Ajv({ allErrors: true, strict: false });
            const valid = ajv.validate(schema, matrix);
            if (!valid) {
              console.error('Schema validation failed:', ajv.errorsText());
              process.exit(1);
            }
            console.log('Routing matrix schema valid');
          "
          
      - name: Run tests
        run: pnpm test

      - name: Security scan
        run: |
          echo "Running security checks..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            
            const securityIssues = [];
            
            function checkDir(dir) {
              const files = fs.readdirSync(dir, { withFileTypes: true });
              for (const file of files) {
                const fullPath = path.join(dir, file.name);
                if (file.isDirectory() && file.name !== 'node_modules') {
                  checkDir(fullPath);
                } else if (file.isFile() && (file.name.endsWith('.json') || file.name.endsWith('.jsonc'))) {
                  const content = fs.readFileSync(fullPath, 'utf8');
                  if (/C:\\\\Users\\\\[^\\\\]+/.test(content)) {
                    securityIssues.push('Absolute path in ' + fullPath);
                  }
                }
              }
            }
            
            checkDir('.');
            if (securityIssues.length > 0) {
              console.error('Security issues:', securityIssues);
              process.exit(1);
            }
            console.log('Security check passed');
          "
